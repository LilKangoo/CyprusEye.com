name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ical_worker_full_deno_typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno typecheck and full offline ICS tests
        run: |
          deno check supabase/functions/hotels-v2-external-calendar-sync/index.ts
          deno test --allow-read \
            supabase/functions/hotels-v2-external-calendar-sync/core_test.ts \
            supabase/functions/hotels-v2-external-calendar-sync/index_test.ts \
            supabase/functions/hotels-v2-external-calendar-sync/static_test.ts

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check shared navigation
        run: npm run navigation:check

      - name: Run lint
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Run Playwright tests
        run: npm run test:e2e

  lighthouse:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: |
          if [ "${{ matrix.form-factor }}" = "desktop" ]; then
            npx lhci autorun \
              --collect.settings.emulatedFormFactor=desktop \
              --collect.settings.screenEmulation.disabled=true;
          else
            npx lhci autorun;
          fi
