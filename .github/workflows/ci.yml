name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Hotels V2 request-only 114497 contract tests
        run: node --test tests/hotelsV2RequestOnly114497.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Hotels V2 browser request-only acceptance (mocked RPC)
        run: npx playwright test tests/e2e/hotels-v2-114497-request-only.spec.ts --project=chromium

      - name: Check shared navigation
        run: npm run navigation:check

      - name: Run lint
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Run Playwright tests
        run: npm run test:e2e

  lighthouse:
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: |
          if [ "${{ matrix.form-factor }}" = "desktop" ]; then
            npx lhci autorun \
              --collect.settings.emulatedFormFactor=desktop \
              --collect.settings.screenEmulation.disabled=true;
          else
            npx lhci autorun;
          fi
