name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hotels_direct_calendar_client_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax of pilot repository
        run: node --check js/hotels-v2-partner-workspace-repository.js
      - name: Fail-closed direct 114496 client tests
        run: node --test tests/hotelsV2CalendarDirect114496Repository.test.mjs

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check shared navigation
        run: npm run navigation:check

      - name: Run lint
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Run Playwright tests
        run: npm run test:e2e

  lighthouse:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: |
          if [ "${{ matrix.form-factor }}" = "desktop" ]; then
            npx lhci autorun \
              --collect.settings.emulatedFormFactor=desktop \
              --collect.settings.screenEmulation.disabled=true;
          else
            npx lhci autorun;
          fi
