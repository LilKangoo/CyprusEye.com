<header class="app-header nav-modern nav-modern--compact ce-site-header" data-site-navigation>
      <button type="button" class="ce-menu-toggle" data-ce-menu aria-expanded="false" aria-controls="ce-site-menu"><span aria-hidden="true">☰</span><span data-ce-label="menu">Menu</span></button><div class="nav-modern__top" aria-label="Global header">
        <div class="brand nav-modern__brand-block">
          <a href="/index.html" class="nav-modern__brand-link" aria-label="CyprusEye Save & Travel home">
            <img
              src="/assets/cyprus_logo-128.png"
              alt="CyprusEye.com - eye with a Cyprus island outline inside."
              data-i18n-attrs="alt:header.logoAlt"
              width="128"
              height="128"
              loading="eager"
              fetchpriority="high"
            />
            <div class="brand-title" data-i18n="header.brand">
              <p class="brand-name">CyprusEye Save &amp; Travel</p>
            </div>
          </a>
        </div>

        <div class="compact-header__profile" data-auth="user-only">
          <button
            type="button"
            class="compact-profile__trigger"
            data-compact-profile-trigger
            aria-expanded="false"
            aria-haspopup="menu"
            aria-controls="compactProfileMenu"
          >
            <img
              id="headerUserAvatar"
              class="profile-avatar"
              src="/assets/cyprus_logo-128.png"
              alt="Avatar"
              width="48"
              height="48"
              loading="eager"
            />
            <span class="compact-profile__summary">
              <span class="profile-name" data-i18n="header.profileLabel">Mój Profil</span>
              <span class="profile-status" data-i18n="header.statusPlaceholder">Poziom 1 • 0 odznak</span>
            </span>
            <span class="compact-profile__chevron" aria-hidden="true">▾</span>
          </button>

          <div class="compact-profile__menu" id="compactProfileMenu" data-compact-profile-menu hidden>
            <div class="compact-profile__menu-header">
              <img
                class="compact-profile__avatar"
                data-compact-user-avatar
                src="/assets/cyprus_logo-128.png"
                alt="Avatar"
                width="48"
                height="48"
                loading="lazy"
              />
              <div class="compact-profile__identity">
                <p class="compact-profile__menu-name" data-compact-user-name data-i18n="header.profileLabel">Mój Profil</p>
                <p class="compact-profile__menu-status" data-compact-user-status data-i18n="header.statusPlaceholder">Poziom 1 • 0 odznak</p>
              </div>
              <button
                type="button"
                class="compact-profile__menu-close"
                data-compact-profile-close
                aria-label="Close"
              >
                X
              </button>
            </div>

            <div class="compact-profile__stats">
              <div class="compact-profile__stat compact-profile__stat--level">
                <span class="compact-profile__stat-label" data-i18n="metrics.level.abbrev">LVL</span>
                <span class="compact-profile__stat-value" id="headerLevelNumber">1</span>
              </div>
              <div class="compact-profile__stat compact-profile__stat--xp compact-profile__xp-card">
                <span class="compact-profile__stat-label" data-i18n="account.profile.labels.xp">XP</span>
                <span class="compact-profile__xp-points"><span id="headerXpPoints">0</span> XP</span>
                <div class="compact-profile__xp-bar" role="img" aria-label="Postęp doświadczenia" data-i18n-attrs="aria-label:metrics.xp.aria">
                  <div class="compact-profile__xp-fill is-width-zero" id="headerXpFill"></div>
                </div>
              </div>
              <div class="compact-profile__stat compact-profile__stat--badges">
                <span class="compact-profile__stat-label" data-i18n="metrics.badges.label">Odznaki</span>
                <span class="compact-profile__stat-value" id="headerBadgesCount">0</span>
              </div>
            </div>

            <div class="compact-profile__actions">
              <a class="compact-profile__link" href="/account/" data-i18n="header.profileLabel">Mój Profil</a>
              <a class="compact-profile__link" href="/achievements.html" data-ce-label="achievements">Osiągnięcia</a><a class="compact-profile__link" href="/plan.html?catalog=saved" data-ce-panel="saved" data-ce-label="saved">Zapisane</a><a class="compact-profile__link" href="/community.html" data-ce-label="community">Społeczność</a><button type="button" class="compact-profile__link" data-ce-panel="notifications" data-ce-label="notifications">Powiadomienia</button><a class="compact-profile__link compact-profile__partner-link" href="/partners/" data-compact-partner-link data-i18n="header.partnerPortal" hidden>Panel partnera</a>
              <button
                class="compact-profile__logout"
                type="button"
                data-auth="logout"
                data-i18n="header.logout"
                data-i18n-attrs="aria-label:auth.logout.aria"
                aria-label="Wyloguj z konta"
              >
                Wyloguj
              </button>
            </div>
          </div>
        </div>

        <div class="nav-modern__top-actions" data-tour-target="top-actions">
          <div class="nav-modern__auth">
            <div id="auth-actions" class="auth-actions-inline" aria-live="polite" data-auth="anon-only">
              <button
                class="compact-header__auth-btn compact-header__auth-btn--primary"
                data-open-auth
                data-auth-target="login"
                data-tour-target="login-button"
                data-i18n="header.login"
                data-i18n-attrs="aria-label:auth.login.aria"
                aria-label="Zaloguj do konta"
              >
                Zaloguj
              </button>
              <button
                class="compact-header__auth-btn"
                type="button"
                data-open-auth
                data-auth-target="register"
                data-i18n="auth.tab.register"
              >
                Rejestracja
              </button>
            </div>
            <div data-auth="spinner" class="auth-spinner-inline" aria-live="polite" data-i18n="auth.status.spinner" hidden>Łączenie...</div>
          </div>

          <button
            id="sosToggle"
            class="nav-modern__sos"
            type="button"
            aria-haspopup="dialog"
            aria-controls="sosModal"
            data-i18n="header.sosToggle"
          >
            ⚠️ SOS
          </button>

          <button
            id="btnOpenCart"
            type="button"
            aria-label="Koszyk"
            data-i18n-attrs="aria-label:shop.cart.aria"
          >
            🛒
            <span id="cartCount" class="cart-count" hidden>0</span>
          </button>

          <div class="language-pill-group" data-language-toggle aria-label="Language selector" data-i18n-attrs="aria-label:language.switcher.label">
            <button type="button" class="language-pill" data-language-pill="pl" aria-pressed="false">PL</button>
            <button type="button" class="language-pill" data-language-pill="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </div>

</header>
{{NAVIGATION}}
